<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Line | Playlists par humeur</title>
  <meta name="description" content="Red Line : des playlists choisies selon votre humeur.">
  <meta name="theme-color" content="#0a0a0c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800;125,900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ ACCUEIL ============ -->
  <main id="view-home" class="view">

    <header class="hero">
      <form class="search" role="search" onsubmit="return false">
        <label for="search-input" class="visually-hidden">Chercher une humeur</label>
        <input id="search-input" type="search" placeholder="MOOD" autocomplete="off">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="14" cy="10" r="6"/><path d="M9.5 14.5 4 20"/></svg>
      </form>

      <div class="hero__slides" id="hero-slides" aria-live="polite"></div>

      <div class="dots" id="hero-dots" role="tablist" aria-label="Diapositives"></div>
    </header>

    <section class="section" aria-labelledby="t-sugg">
      <h2 id="t-sugg" class="section__title">Suggestions</h2>
      <ol class="sugg" id="sugg-list"></ol>
      <p class="empty" id="sugg-empty" hidden>Aucune humeur ne correspond. Essayez « calme », « colère » ou « nuit ».</p>
      <div class="pager" id="sugg-pager" aria-label="Pages de suggestions"></div>
    </section>

    <section class="section" aria-labelledby="t-pop">
      <h2 id="t-pop" class="section__title">Populaires</h2>

      <h3 class="section__sub">Playlists</h3>
      <ul class="grid" id="playlist-grid"></ul>

      <h3 class="section__sub">Artistes</h3>
      <ul class="grid" id="artist-grid"></ul>
    </section>
  </main>

  <!-- ============ PLAYLIST / ARTISTE ============ -->
  <main id="view-detail" class="view detail" hidden>
    <a href="#/" class="back">← Retour</a>
    <h1 class="big-title" id="detail-title"></h1>
    <p class="detail__desc" id="detail-desc"></p>
    <div class="eq" id="detail-eq" aria-hidden="true"></div>
    <ol class="tracks" id="detail-tracks"></ol>
    <footer class="detail__foot">
      <span id="detail-label">PLAYED ON REPEAT</span>
      <span class="palette" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </footer>
  </main>

  <!-- ============ LECTEUR ============ -->
  <aside class="player" id="player" aria-label="Lecteur" hidden>
    <div class="player__top">
      <p class="player__title" id="player-title">Titre - Artiste</p>
      <div class="player__ctrl">
        <button id="btn-prev" aria-label="Morceau précédent">
          <svg viewBox="0 0 24 24"><path d="M12 6 4 12l8 6zM20 6l-8 6 8 6z"/></svg>
        </button>
        <button id="btn-play" class="play" aria-label="Pause">
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 6h3v12H8zM13 6h3v12h-3z"/></svg>
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="btn-next" aria-label="Morceau suivant">
          <svg viewBox="0 0 24 24"><path d="M4 6l8 6-8 6zM12 6l8 6-8 6z"/></svg>
        </button>
      </div>
    </div>
    <div class="progress" id="progress" role="slider" tabindex="0" aria-label="Position dans le morceau" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress__fill" id="progress-fill"></div>
      <div class="progress__knob" id="progress-knob"></div>
    </div>
    <div class="player__time">
      <span id="time-cur">0:00</span>
      <span id="time-tot">0:00</span>
    </div>
  </aside>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
