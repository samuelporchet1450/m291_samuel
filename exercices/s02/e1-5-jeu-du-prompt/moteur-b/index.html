<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuit des Musées 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="event-container">
        <article class="event-card">

            <header class="event-header">
                <p class="event-category">ÉVÉNEMENT CULTUREL</p>
                <h1 class="event-title">Nuit des Musées 2026</h1>
                <p class="event-subtitle">
                    Une nuit pour découvrir la culture autrement.
                </p>
            </header>

            <section class="event-details">

                <div class="event-info">
                    <h2>Lieu</h2>
                    <address class="event-location">
                        Plateforme 10, Lausanne
                    </address>
                </div>

                <div class="event-info">
                    <h2>Horaires</h2>
                    <p>
                        <time datetime="18:00">Samedi 18h00</time>
                        -
                        <time datetime="02:00">02h00</time>
                    </p>
                </div>

                <div class="event-info">
                    <h2>Tarif</h2>
                    <p class="event-price">
                        Entrée libre avec pass culturel
                    </p>
                </div>

            </section>

            <footer class="event-footer">
                <p>LAUSANNE · 2026</p>
            </footer>

        </article>
    </main>

</body>
</html>
