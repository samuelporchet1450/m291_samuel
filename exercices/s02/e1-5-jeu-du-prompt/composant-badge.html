<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carte événement — e1-5</title>
  <style>
    :root {
      --c-fond: #f3f4f6;
      --c-carte: #ffffff;
      --c-texte: #1f2937;
      --c-doux: #4b5563;
      --c-accent: #9a3412;
      --c-accent-fond: #fff7ed;
      --rayon: 0.9rem;
      --police: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: var(--c-fond); font-family: var(--police); color: var(--c-texte); }
    .evenement { width: min(100%, 24rem); background: var(--c-carte); border-radius: var(--rayon); padding: 1.5rem; box-shadow: 0 4px 16px rgb(0 0 0 / 0.08); border-top: 6px solid var(--c-accent); }
    .evenement__titre { margin: 0 0 0.75rem; font-size: 1.5rem; font-weight: 800; line-height: 1.2; }
    .evenement__infos { display: flex; flex-direction: column; gap: 0.35rem; color: var(--c-doux); }
    .evenement__infos address { font-style: normal; }
    .evenement__tarif { display: inline-block; margin: 1rem 0 0; padding: 0.3rem 0.8rem; border-radius: 999px; background: var(--c-accent-fond); color: var(--c-accent); font-weight: 700; font-size: 0.9rem; }
  </style>
</head>
<body>
  <article class="evenement">
    <header>
      <h2 class="evenement__titre">Nuit des Musées 2026</h2>
    </header>
    <div class="evenement__infos">
      <address>Plateforme 10, Lausanne</address>
      <time datetime="2026-09-26T18:00">Samedi 18h00 - 02h00</time>
    </div>
    <p class="evenement__tarif">Entrée libre avec pass culturel</p>
  </article>
</body>
</html>
