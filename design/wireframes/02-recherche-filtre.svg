<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Arial, sans-serif">
  <title>Wireframe 02 — Vue filtrée / recherche (390 px)</title>
  <rect width="390" height="844" fill="#fff" stroke="#000" stroke-width="2"/>
  <rect x="0" y="0" width="390" height="64" fill="#eee"/>
  <text x="16" y="40" font-size="20" font-weight="bold">RED LINE</text>
  <!-- Recherche remplie -->
  <rect x="16" y="80" width="358" height="48" fill="#fff" stroke="#000" stroke-width="3" rx="4"/>
  <text x="32" y="110" font-size="14" fill="#000">🔍 nuit</text>
  <rect x="330" y="88" width="32" height="32" fill="#eee" stroke="#666"/><text x="340" y="110" font-size="14">✕</text>
  <!-- Puces humeurs rapides -->
  <rect x="16" y="144" width="96" height="44" rx="22" fill="#999" stroke="#000" stroke-width="2"/><text x="36" y="171" font-size="13" font-weight="bold">✓ Nuit</text>
  <rect x="120" y="144" width="90" height="44" rx="22" fill="#fff" stroke="#666" stroke-width="2"/><text x="140" y="171" font-size="13">Calme</text>
  <rect x="218" y="144" width="96" height="44" rx="22" fill="#fff" stroke="#666" stroke-width="2"/><text x="236" y="171" font-size="13">Colère</text>
  <rect x="322" y="144" width="52" height="44" rx="22" fill="#fff" stroke="#666" stroke-width="2"/><text x="336" y="171" font-size="13">…</text>
  <!-- Compteur résultats -->
  <text x="16" y="220" font-size="14" fill="#333">3 playlists pour « nuit »</text>
  <!-- Résultats -->
  <g font-size="12">
    <rect x="16" y="236" width="358" height="88" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="24" y="244" width="72" height="72" fill="#ddd" stroke="#666"/><line x1="24" y1="244" x2="96" y2="316" stroke="#666"/><line x1="96" y1="244" x2="24" y2="316" stroke="#666"/>
    <text x="108" y="264" font-weight="bold" font-size="14">RED LINE SESSION</text><text x="108" y="284" fill="#555">Nuit blanche · 4 morceaux</text>
    <rect x="108" y="294" width="64" height="18" fill="#eee" stroke="#999"/><text x="114" y="307">#nuit</text>

    <rect x="16" y="332" width="358" height="88" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="24" y="340" width="72" height="72" fill="#ddd" stroke="#666"/><line x1="24" y1="340" x2="96" y2="412" stroke="#666"/><line x1="96" y1="340" x2="24" y2="412" stroke="#666"/>
    <rect x="108" y="352" width="150" height="12" fill="#999"/><rect x="108" y="374" width="110" height="10" fill="#ccc"/>

    <rect x="16" y="428" width="358" height="88" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="24" y="436" width="72" height="72" fill="#ddd" stroke="#666"/><line x1="24" y1="436" x2="96" y2="508" stroke="#666"/><line x1="96" y1="436" x2="24" y2="508" stroke="#666"/>
    <rect x="108" y="448" width="130" height="12" fill="#999"/><rect x="108" y="470" width="90" height="10" fill="#ccc"/>
  </g>
  <!-- État vide (variante) -->
  <rect x="16" y="540" width="358" height="200" fill="#f6f6f6" stroke="#999" stroke-dasharray="8 6" stroke-width="2"/>
  <text x="28" y="566" font-size="12" fill="#555">VARIANTE : aucun résultat</text>
  <circle cx="195" cy="610" r="22" fill="none" stroke="#666" stroke-width="3"/><line x1="211" y1="626" x2="228" y2="643" stroke="#666" stroke-width="3"/>
  <text x="40" y="672" font-size="13">Aucune humeur ne correspond à « reggaeton ».</text>
  <text x="40" y="694" font-size="13">Essaie :</text>
  <rect x="100" y="680" width="64" height="32" fill="#fff" stroke="#000"/><text x="110" y="701" font-size="12">calme</text>
  <rect x="170" y="680" width="70" height="32" fill="#fff" stroke="#000"/><text x="180" y="701" font-size="12">colère</text>
  <rect x="246" y="680" width="56" height="32" fill="#fff" stroke="#000"/><text x="258" y="701" font-size="12">nuit</text>
  <rect x="0" y="776" width="390" height="68" fill="#ddd" stroke="#000" stroke-width="2"/>
  <text x="16" y="815" font-size="12" fill="#333">Lecteur (identique à l'écran 1)</text>
</svg>
