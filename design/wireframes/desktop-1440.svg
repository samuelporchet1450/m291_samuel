<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Arial, sans-serif">
  <title>Wireframe desktop 1440 px — grille 12 colonnes, contenu max 1200 px</title>
  <rect width="1440" height="900" fill="#fff" stroke="#000" stroke-width="2"/>
  <!-- Repères des 12 colonnes (1200 px, gouttière 24 px → colonne 78 px) -->
  <g fill="#f3f3f3">
    <rect x="120" y="0" width="78" height="900"/><rect x="222" y="0" width="78" height="900"/><rect x="324" y="0" width="78" height="900"/>
    <rect x="426" y="0" width="78" height="900"/><rect x="528" y="0" width="78" height="900"/><rect x="630" y="0" width="78" height="900"/>
    <rect x="732" y="0" width="78" height="900"/><rect x="834" y="0" width="78" height="900"/><rect x="936" y="0" width="78" height="900"/>
    <rect x="1038" y="0" width="78" height="900"/><rect x="1140" y="0" width="78" height="900"/><rect x="1242" y="0" width="78" height="900"/>
  </g>
  <text x="124" y="890" font-size="11" fill="#888">12 colonnes · contenu 1200 px centré (margin: 0 auto) · gouttière 24 px</text>
  <!-- En-tête horizontal développé -->
  <rect x="120" y="16" width="1200" height="64" fill="#e6e6e6" stroke="#000" stroke-width="2"/>
  <text x="140" y="56" font-size="22" font-weight="bold">RED LINE</text>
  <text x="420" y="54" font-size="15">Carte des humeurs</text><line x1="420" y1="60" x2="556" y2="60" stroke="#000" stroke-width="3"/>
  <text x="590" y="54" font-size="15">Playlists</text><text x="690" y="54" font-size="15">Artistes</text><text x="790" y="54" font-size="15">Proposer une playlist</text>
  <rect x="1020" y="28" width="284" height="40" fill="#fff" stroke="#333" stroke-width="2"/><text x="1034" y="54" font-size="14" fill="#777">🔍 Chercher une humeur…</text>
  <!-- Colonne gauche (3 col) : filtres / carte -->
  <rect x="120" y="104" width="282" height="660" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <text x="136" y="134" font-size="16" font-weight="bold">Ton humeur</text>
  <rect x="136" y="148" width="250" height="250" fill="#eee" stroke="#333"/>
  <line x1="261" y1="148" x2="261" y2="398" stroke="#999" stroke-dasharray="6 4"/><line x1="136" y1="273" x2="386" y2="273" stroke="#999" stroke-dasharray="6 4"/>
  <circle cx="220" cy="300" r="12" fill="#000"/>
  <text x="136" y="428" font-size="13">Énergie 35 % · Luminosité 30 %</text>
  <text x="136" y="468" font-size="16" font-weight="bold">Humeurs rapides</text>
  <rect x="136" y="482" width="110" height="40" rx="20" fill="#999" stroke="#000"/><text x="160" y="507" font-size="13">✓ Nuit</text>
  <rect x="256" y="482" width="110" height="40" rx="20" fill="#fff" stroke="#666"/><text x="282" y="507" font-size="13">Calme</text>
  <rect x="136" y="530" width="110" height="40" rx="20" fill="#fff" stroke="#666"/><text x="160" y="555" font-size="13">Colère</text>
  <rect x="256" y="530" width="110" height="40" rx="20" fill="#fff" stroke="#666"/><text x="276" y="555" font-size="13">Euphorie</text>
  <!-- Zone droite (9 col) : grille de cartes 3 x 2 -->
  <text x="426" y="134" font-size="20" font-weight="bold">Ta sélection</text><text x="1180" y="134" font-size="13" fill="#555">6 playlists</text>
  <g stroke="#333" stroke-width="2" fill="#fff">
    <rect x="426" y="150" width="282" height="290"/><rect x="732" y="150" width="282" height="290"/><rect x="1038" y="150" width="282" height="290"/>
    <rect x="426" y="464" width="282" height="290"/><rect x="732" y="464" width="282" height="290"/><rect x="1038" y="464" width="282" height="290"/>
  </g>
  <g stroke="#777" fill="#ddd">
    <rect x="442" y="166" width="250" height="160"/><rect x="748" y="166" width="250" height="160"/><rect x="1054" y="166" width="250" height="160"/>
    <rect x="442" y="480" width="250" height="160"/><rect x="748" y="480" width="250" height="160"/><rect x="1054" y="480" width="250" height="160"/>
  </g>
  <g stroke="#777">
    <line x1="442" y1="166" x2="692" y2="326"/><line x1="692" y1="166" x2="442" y2="326"/>
    <line x1="748" y1="166" x2="998" y2="326"/><line x1="998" y1="166" x2="748" y2="326"/>
    <line x1="1054" y1="166" x2="1304" y2="326"/><line x1="1304" y1="166" x2="1054" y2="326"/>
    <line x1="442" y1="480" x2="692" y2="640"/><line x1="692" y1="480" x2="442" y2="640"/>
    <line x1="748" y1="480" x2="998" y2="640"/><line x1="998" y1="480" x2="748" y2="640"/>
    <line x1="1054" y1="480" x2="1304" y2="640"/><line x1="1304" y1="480" x2="1054" y2="640"/>
  </g>
  <g fill="#999">
    <rect x="442" y="344" width="180" height="14"/><rect x="748" y="344" width="160" height="14"/><rect x="1054" y="344" width="170" height="14"/>
    <rect x="442" y="658" width="150" height="14"/><rect x="748" y="658" width="190" height="14"/><rect x="1054" y="658" width="140" height="14"/>
  </g>
  <g fill="#ccc">
    <rect x="442" y="370" width="110" height="10"/><rect x="748" y="370" width="110" height="10"/><rect x="1054" y="370" width="110" height="10"/>
    <rect x="442" y="684" width="110" height="10"/><rect x="748" y="684" width="110" height="10"/><rect x="1054" y="684" width="110" height="10"/>
  </g>
  <!-- Lecteur fixe -->
  <rect x="0" y="790" width="1440" height="80" fill="#ddd" stroke="#000" stroke-width="2"/>
  <rect x="120" y="810" width="220" height="14" fill="#888"/><rect x="120" y="834" width="150" height="10" fill="#aaa"/>
  <rect x="640" y="808" width="44" height="44" fill="none" stroke="#000"/><rect x="698" y="808" width="44" height="44" fill="#999" stroke="#000"/><rect x="756" y="808" width="44" height="44" fill="none" stroke="#000"/>
  <rect x="860" y="826" width="460" height="6" fill="#999"/>
</svg>
